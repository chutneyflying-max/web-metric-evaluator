name: Web Metric Evaluator

on:
  schedule:
    # Staggered offset schedule (independent cron registrations to prevent single-line queue drops)
    - cron: "4 * * * *"
    - cron: "19 * * * *"
    - cron: "34 * * * *"
    - cron: "49 * * * *"
  workflow_dispatch:

concurrency:
  group: metric-evaluator-pulse
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --omit=dev --silent --no-audit --no-fund
          if [ ! -f /usr/bin/google-chrome ]; then
            npx playwright install chromium
          fi

      - name: Run Availability Audit for Shard ${{ matrix.partition }}
        env:
          WP_ENDPOINT: ${{ secrets.WP_ENDPOINT }}
          DOWNRADAR_INGEST_SECRET: ${{ secrets.DOWNRADAR_INGEST_SECRET }}
          PARTITION_ID: ${{ matrix.partition }}
          TOTAL_PARTITIONS: 4
          TIME_WINDOW: "now 1-H"
          CHROME_PATH: "/usr/bin/google-chrome"
        run: |
          node src/evaluator.js
